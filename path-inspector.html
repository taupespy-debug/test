<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haptic Test 2</title>
<style>
:root{color-scheme:dark;--bg:#0d0b14;--panel:#17131f;--line:#2c2639;--fg:#efeaf7;--muted:#9b93ad;--accent:#a24bff;--ok:#3ddc84;--bad:#ff5a6e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;margin-bottom:10px}
.card h2{font-size:15px;margin:0}
.card small{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;font:600 15px system-ui;padding:12px 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.96)}
.vote{font:600 13px system-ui;padding:8px 12px;border-radius:12px;background:transparent;border:1px solid var(--line);color:var(--fg)}
.vote.on.y{background:var(--ok);color:#062010;border-color:transparent}
.vote.on.n{background:var(--bad);color:#2a0008;border-color:transparent}
.count{font:600 13px ui-monospace,Menlo,monospace;color:var(--muted)}
/* A: a real switch stretched over the whole button, almost invisible */
.ov input[switch]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:.011;-webkit-appearance:auto;appearance:auto;cursor:pointer}
/* B: same, but fully see-through */
.ov0 input[switch]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
/* C: whole button is a label wrapping a tiny on-screen switch */
.lb input[switch]{position:absolute;right:6px;bottom:6px;width:20px;height:12px;margin:0;opacity:.011;pointer-events:none}
/* D: label + switch clipped to 1px but still on screen */
.clip input[switch]{position:absolute;left:50%;top:50%;width:1px;height:1px;margin:0;clip-path:inset(50%);pointer-events:none}
/* E: scaled-up real switch, invisible, centered */
.big input[switch]{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(4);margin:0;opacity:.011}
pre{margin:0;font:12px ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#d8d0ea}
</style></head><body>
<h1>Haptic Test 2</h1>
<p class="lede">Round one showed only a real finger tap on a switch makes a buzz. These hide a real switch exactly where you tap, in different ways. Tap each button a few times, then mark it.</p>

<div id="list"></div>

<div class="card">
  <h2>Baseline: visible switch</h2>
  <small>The one you already felt.</small>
  <div class="row"><input type="checkbox" switch style="transform:scale(1.4);margin:6px 12px"></div>
</div>

<div class="card">
  <button class="btn" id="copy" style="width:100%">Copy results</button>
  <pre id="out"></pre>
</div>

<script>
const TESTS = [
  { id:'overlay', cls:'ov', name:'A. Invisible switch over the button', desc:'A real switch stretched over the button at 1% opacity. Your finger flips it.', html:'<input type="checkbox" switch>' },
  { id:'overlay0', cls:'ov0', name:'B. Fully see-through switch over the button', desc:'Same as A but 0% opacity.', html:'<input type="checkbox" switch>' },
  { id:'labelWrap', cls:'lb', tag:'label', name:'C. Button is a label for a tiny switch', desc:'Tapping anywhere on the button flips a tiny real switch inside it.', html:'<input type="checkbox" switch tabindex="-1">' },
  { id:'labelClip', cls:'clip', tag:'label', name:'D. Label + 1px clipped switch', desc:'Like C, but the switch is shrunk to one pixel.', html:'<input type="checkbox" switch tabindex="-1">' },
  { id:'bigSwitch', cls:'big', name:'E. Huge invisible switch', desc:'A real switch scaled up 4x over the button.', html:'<input type="checkbox" switch>' }
];
const res = {}, list = document.getElementById('list');
list.innerHTML = TESTS.map(t => `<div class="card" data-id="${t.id}"><h2>${t.name}</h2><small>${t.desc}</small>
  <div class="row"><${t.tag || 'div'} class="btn ${t.cls}">Tap me${t.html}</${t.tag || 'div'}><span class="count">0 taps</span><span style="flex:1"></span><button class="vote y">Felt it</button><button class="vote n">Nothing</button></div></div>`).join('');
TESTS.forEach(t => {
  const card = list.querySelector(`[data-id="${t.id}"]`), b = card.querySelector('.btn'), c = card.querySelector('.count');
  let n = 0;
  b.addEventListener('click', ev => { if (t.tag === 'label' && ev.target.tagName === 'INPUT') return; n++; c.textContent = n + ' tap' + (n === 1 ? '' : 's'); res[t.id] = Object.assign(res[t.id] || {}, { taps: n }); show(); });
  card.querySelectorAll('.vote').forEach(v => v.addEventListener('click', () => {
    card.querySelectorAll('.vote').forEach(x => x.classList.remove('on')); v.classList.add('on');
    res[t.id] = Object.assign(res[t.id] || {}, { felt: v.classList.contains('y') }); show();
  }));
});
function show(){ document.getElementById('out').textContent = JSON.stringify({ ua: navigator.userAgent, results: res }, null, 2); }
show();
document.getElementById('copy').addEventListener('click', async () => {
  const t = document.getElementById('out').textContent, b = document.getElementById('copy');
  try { await navigator.clipboard.writeText(t); b.textContent = 'Copied'; }
  catch(e){ const r = document.createRange(); r.selectNodeContents(document.getElementById('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected, use Copy'; }
  setTimeout(() => b.textContent = 'Copy results', 1600);
});
</script>
</body></html>
