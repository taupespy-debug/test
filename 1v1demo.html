<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Emberline 1v1</title>
<meta name="theme-color" content="#07060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* a stand-alone, scripted Emberline 1v1 for screen recording: same look as the app, nothing else on screen.
   ?you=Name  ?them=Name  ?c=9900cc (your color)  ?c2=ff3b8a (theirs)  ?bet=25 */
:root{color-scheme:dark;--bg:#07060c;--card:#16131f;--card2:#201c2c;--line:rgba(255,255,255,.1);--ink:#f4f1fa;--dim:#a39cb8;--f-disp:'Unbounded',system-ui,sans-serif;--f-body:'Manrope',system-ui,sans-serif;--c1:#9900cc;--c2:#ff3b8a;--c1b:#ffffff;--c2b:#ffb020}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none}
body::before{content:'';position:fixed;inset:-20%;background:radial-gradient(40% 30% at 20% 20%,color-mix(in srgb,var(--c1) 30%,transparent),transparent 70%),radial-gradient(40% 30% at 80% 80%,color-mix(in srgb,var(--c2) 22%,transparent),transparent 70%);pointer-events:none}
.stage{position:relative;height:100%;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(14px,env(safe-area-inset-left,0px))}
.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;font:800 15px var(--f-disp);letter-spacing:.02em;opacity:.9}
.brand i{font-style:normal;background:linear-gradient(90deg,#b04bff,#ff5ec8);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{position:relative;width:min(100%,410px);display:grid;gap:14px;padding:20px 16px;border-radius:28px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5);transition:border-color .4s,box-shadow .4s}
.lbl{display:flex;justify-content:center;align-items:center;gap:8px;font:700 13px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.beta{font:900 10px var(--f-body);letter-spacing:.12em;padding:3px 6px;border-radius:6px;background:#ffd23f;color:#111}
.muted{color:var(--dim)}
.center{text-align:center;margin:0}
.big{font:900 34px/1.1 var(--f-disp);text-align:center;margin:0}
.vs2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{display:grid;gap:4px;justify-items:center;text-align:center;padding:14px 8px;border-radius:18px;background:var(--card2);border-top:4px solid var(--pc)}
.side.you{outline:2px solid var(--pc)}
.side b{font-size:15px}.side span{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.side .ok{color:#3ddc84;font-weight:800}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--c1);animation:sp 1s linear infinite;justify-self:center}
@keyframes sp{to{transform:rotate(360deg)}}
.bet{color:#ffd23f;font-weight:800}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--ink);font:700 16px var(--f-body);padding:14px;border-radius:99px;text-align:center}
.btn.go{background:#9900cc;border-color:#c066e8;color:#fff}
/* arena */
.arena{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;padding:16px 6px 12px;border-radius:22px;overflow:hidden;isolation:isolate;
  background:radial-gradient(90% 70% at 0% 15%,color-mix(in srgb,var(--c1b) 22%,transparent),transparent 60%),radial-gradient(120% 90% at 0% 70%,color-mix(in srgb,var(--c1) 34%,transparent),transparent 60%),radial-gradient(90% 70% at 100% 15%,color-mix(in srgb,var(--c2b) 24%,transparent),transparent 60%),radial-gradient(120% 90% at 100% 70%,color-mix(in srgb,var(--c2) 34%,transparent),transparent 60%),#0d0b14}
.arena::after{content:'';position:absolute;left:50%;top:-20%;bottom:-20%;width:3px;transform:translateX(-50%) skewX(-14deg);background:linear-gradient(transparent,rgba(255,255,255,.5),transparent);z-index:0}
.embers{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.embers i{position:absolute;bottom:-8px;width:4px;height:4px;border-radius:50%;opacity:0;animation:em 5s linear infinite}
@keyframes em{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-280px) translateX(14px) scale(.3);opacity:0}}
.live{position:absolute;z-index:3;top:9px;left:50%;transform:translateX(-50%);font:800 11px var(--f-body);letter-spacing:.12em;color:#3ddc84;white-space:nowrap}
.p{position:relative;z-index:1;display:grid;justify-items:center;gap:4px;min-width:0;isolation:isolate}
.ring{position:relative;width:100px;height:100px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:6}.ring .bg{stroke:rgba(255,255,255,.12)}.ring .fg{stroke-linecap:round;filter:drop-shadow(0 0 5px var(--pc));transition:stroke-dashoffset .3s linear}
.av{position:absolute;inset:12px;border-radius:50%;display:grid;place-items:center;font:900 32px var(--f-disp);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.p.hitting .ring{animation:glow .9s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 16px var(--pc))}}
.n{font-weight:800;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h{font:900 46px/1 var(--f-disp);font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--pc)}
.h.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.6);color:var(--pc)}100%{transform:scale(1)}}
.sub{font-size:12px;opacity:.75;white-space:nowrap}
.clock{font:800 16px var(--f-disp);font-variant-numeric:tabular-nums;padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.1)}
.p.low .clock{background:#ff3b4a;animation:beat 1s ease-in-out infinite}.p.low .ring{animation:shake .5s ease-in-out infinite}.p.low .fg{stroke:#ff3b4a!important}
@keyframes beat{50%{transform:scale(1.12)}}@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.ltag{font:900 9px var(--f-body);letter-spacing:.14em;padding:3px 7px;border-radius:6px;background:var(--pc);color:#111;opacity:0;transform:translateY(4px);transition:.3s}
.p.lead .ltag{opacity:1;transform:none}
.vs{position:relative;z-index:2;font:900 italic 26px var(--f-disp);color:#fff;padding:6px 9px;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c1b),var(--c2),var(--c2b));transform:skewX(-8deg);overflow:hidden;animation:vsb 3.2s ease-in-out infinite}
.vs::after{content:'';position:absolute;inset:-20% auto -20% -60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:gl 3.2s ease-in-out infinite}
@keyframes vsb{50%{transform:skewX(-8deg) scale(1.08)}}@keyframes gl{0%,55%{left:-60%}75%,100%{left:130%}}
.flame{position:absolute;z-index:-1;left:50%;bottom:22%;width:130%;height:85%;transform:translateX(-50%);pointer-events:none;opacity:0}
.flame i{position:absolute;bottom:0;width:34%;height:70%;border-radius:50% 50% 35% 35%/70% 70% 30% 30%;background:radial-gradient(ellipse at 50% 85%,#fff6c2 0%,#ffd23f 22%,var(--pc) 55%,transparent 72%);filter:blur(3px);mix-blend-mode:screen;transform-origin:50% 100%}
.flame i:nth-child(1){left:2%;height:55%}.flame i:nth-child(2){left:18%;height:78%}.flame i:nth-child(3){left:33%;height:100%;width:36%}.flame i:nth-child(4){left:50%;height:80%}.flame i:nth-child(5){left:66%;height:58%}
.flame b{position:absolute;left:50%;top:14%;transform:translateX(-50%);font:900 italic 15px var(--f-disp);letter-spacing:.12em;color:#fff;text-shadow:0 0 10px #ffd23f,0 0 20px var(--pc);white-space:nowrap}
.p.blaze .flame{animation:bz 4.2s ease forwards}.p.blaze .flame i{animation:fl .35s ease-in-out infinite alternate}.p.blaze .flame i:nth-child(2n){animation-duration:.27s}
.p.blaze .h,.p.blaze .sub{text-shadow:0 2px 10px rgba(0,0,0,.75),0 0 18px var(--pc)}
@keyframes bz{0%{opacity:0;transform:translateX(-50%) scaleY(.3)}12%{opacity:1;transform:translateX(-50%) scaleY(1.1)}20%{transform:translateX(-50%) scaleY(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) scaleY(.8)}}
@keyframes fl{0%{transform:scaleY(.82) scaleX(1.05) rotate(-3deg)}100%{transform:scaleY(1.12) scaleX(.92) rotate(3deg)}}
.plus{position:absolute;z-index:4;top:34%;font:900 32px var(--f-disp);color:#fff;text-shadow:0 0 12px var(--pc);pointer-events:none;animation:pl .9s ease-out forwards}
@keyframes pl{0%{transform:translateY(10px) scale(.6);opacity:0}25%{opacity:1;transform:scale(1.2)}100%{transform:translateY(-36px);opacity:0}}
.rules{font-size:13px;color:var(--dim);text-align:center;margin:0}
/* overlays */
.splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--sc) 35%,transparent),transparent 65%);animation:fd 1.6s ease forwards}
.splash b{display:block;font:900 italic 76px/1 var(--f-disp);color:#fff;text-shadow:0 0 30px var(--sc),0 4px 0 rgba(0,0,0,.4);animation:sl 1.4s cubic-bezier(.2,1.4,.4,1) forwards;text-align:center}
.splash small{display:block;text-align:center;font:800 15px var(--f-body);letter-spacing:.2em;margin-top:8px}
@keyframes sl{0%{transform:scale(2.4) skewX(-10deg);opacity:0}25%{transform:scale(1) skewX(-10deg);opacity:1}80%{opacity:1}100%{transform:scale(.9) skewX(-10deg);opacity:0}}
@keyframes fd{0%,80%{opacity:1}100%{opacity:0}}
.frame{position:fixed;inset:0;z-index:15;pointer-events:none;border:3px solid transparent;border-image:linear-gradient(135deg,var(--c1),var(--c1b),var(--c1)) 1;box-shadow:inset 0 0 40px color-mix(in srgb,var(--c1) 35%,transparent);opacity:0;transition:opacity .5s}
.frame.on{opacity:.85}.frame.low{border-image:none;border-color:#ff3b4a;box-shadow:inset 0 0 50px rgba(255,59,74,.45);animation:fb 1s ease-in-out infinite}
@keyframes fb{50%{opacity:.45}}
.confetti{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:cf 2.6s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes cf{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.85}}
/* result */
body.win::after,body.lose::after{content:'';position:fixed;inset:0;z-index:-1}
body.win{background:radial-gradient(circle at 50% 28%,#7a5a00,#1e1400 72%)}
body.win .card{border-color:#ffd23f;box-shadow:0 0 0 1px #ffd23f,0 0 60px rgba(255,210,63,.45)}
.res{display:grid;gap:4px;justify-items:center;text-align:center}
.res .t{font:900 italic 48px/1.05 var(--f-disp);background:linear-gradient(100deg,#fff6c2,#ffd23f 30%,#ffb020 50%,#fff6c2 70%,#ffd23f);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.4s linear infinite,rp .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes sh{to{background-position:-220% 0}}@keyframes rp{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.rp{font:900 30px var(--f-disp);color:#3ddc84;text-align:center}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}thead th{font-size:12px;color:var(--dim)}tbody th{text-align:left;font-weight:600;color:var(--dim)}td.up{color:#3ddc84;font-weight:800}
.replay{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font:700 13px var(--f-body);color:var(--dim);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:99px;padding:8px 14px;opacity:0;transition:opacity .4s}
.replay.on{opacity:1}
.tap{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg)}
.tap div{display:grid;gap:12px;justify-items:center;text-align:center;padding:24px}
.tap b{font:800 22px var(--f-disp)}.tap span{color:var(--dim);font-size:14px;max-width:30ch}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<div class="stage"><div class="brand">Emberline <i>1v1</i></div><div class="card" id="card"></div></div>
<div class="frame" id="frame"></div>
<div class="replay" id="replay">Tap anywhere to replay</div>
<div class="tap" id="tap"><div><b>Emberline 1v1</b><span>Start your screen recording, then tap to play the match.</span><span style="font-size:12px">About 60 seconds</span></div></div>
<script>
(() => {
  const q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
  const hex = (v, d) => /^[0-9a-f]{6}$/i.test(v || '') ? '#' + v : d;
  const YOU = (q.get('you') || 'You').slice(0, 16), THEM = (q.get('them') || 'Zay.Clouds').slice(0, 16), BET = Math.max(0, +q.get('bet') || 25);
  const C1 = hex(q.get('c'), '#9900cc'), C2 = hex(q.get('c2'), '#ff3b8a');
  document.documentElement.style.setProperty('--c1', C1); document.documentElement.style.setProperty('--c2', C2);
  const PPS = 10, CAP = 45;
  const SCRIPT = [{ who:'me', at:2, len:4.5 }, { who:'op', at:4, len:3.6 }, { who:'op', at:9.5, len:9.2 }, { who:'me', at:12.5, len:11.6 },
    { who:'op', at:24, len:4.1 }, { who:'me', at:28, len:5.2 }, { who:'op', at:33, len:3.3 }, { who:'me', at:37.5, len:5.4 }];
  const card = $('#card'), mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };
  let T0 = 0, phase = '', st = null, timer = 0, steps = [];
  const P = () => ({ pts:0, hits:0, best:0, tot:0, bl:0, on:false, start:0 });

  function splash(t, sub, c){ const e = document.createElement('div'); e.className = 'splash'; e.style.setProperty('--sc', c); e.innerHTML = `<div><b>${t}</b>${sub ? `<small>${sub}</small>` : ''}</div>`; document.body.appendChild(e); setTimeout(() => e.remove(), 1700); }
  function confetti(){ const e = document.createElement('div'); e.className = 'confetti'; const cs = ['#ffd23f', '#fff1a8', '#ffb020', C1, '#ffffff'];
    e.innerHTML = Array.from({ length: 56 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${cs[i % 5]};animation-delay:${Math.random() * .6}s;animation-duration:${2 + Math.random() * 1.4}s;--r:${Math.round(Math.random() * 720 - 360)}deg;--x:${Math.round(Math.random() * 120 - 60)}px"></i>`).join('');
    document.body.appendChild(e); setTimeout(() => e.remove(), 4500); }

  function lobby(){
    card.innerHTML = `<div class="lbl">1v1 <span class="beta">BETA</span></div><div class="spin"></div><p class="big" style="font-size:24px">Match found</p>
      <p class="center">vs <b>${THEM}</b> · <span style="color:#e9bb4f;font-weight:800">Champion</span></p>
      <p class="center muted" style="font-size:13px">45 sec match · every second of every hit scores<br>505°F · 120s · Bold · Boost +1°F / +15s</p>
      ${BET ? `<p class="center bet">${BET} RP on the line</p>` : ''}`;
  }
  function heat(dt){
    const t = s => Math.round(Math.min(505, 90 + 415 * dt / s)), s = (sec, you) => dt >= sec ? '<span class="ok">✓ Ready</span>' : `<span>Heating · ${t(sec)}°F</span>`;
    card.innerHTML = `<div class="lbl">1v1 <span class="beta">BETA</span></div><p class="big">Heating up</p>
      <div class="vs2"><div class="side you" style="--pc:${C1}"><b>${YOU}</b>${s(5.5)}</div><div class="side" style="--pc:${C2}"><b>${THEM}</b>${s(3.5)}</div></div>
      <p class="center muted" style="font-size:14px">The match starts when both Peaks are Ready.</p>
      <div class="btns"><div class="btn">Minimize</div><div class="btn">Give up</div></div>`;
  }
  const C = 2 * Math.PI * 44;
  function arenaBuild(){
    const emb = Array.from({ length: 12 }, (_, i) => `<i style="left:${i * 8.3 + 3}%;animation-delay:-${(i * .73) % 5}s;animation-duration:${4 + (i * 1.7) % 3}s;background:${i % 2 ? C2 : C1}"></i>`).join('');
    const pl = (side, name, pc, g) => `<div class="p" id="p-${side}" style="--pc:${pc}"><div class="flame"><i></i><i></i><i></i><i></i><i></i><b>BLINKER</b></div>
      <div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${pc}"/><stop offset="1" stop-color="${side === 'me' ? '#ffffff' : '#ffb020'}"/></linearGradient></defs>
        <circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" cx="50" cy="50" r="44" stroke="url(#${g})" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
        <div class="av" style="background:linear-gradient(135deg,${pc},${side === 'me' ? '#ffffff' : '#ffb020'})">${name[0].toUpperCase()}</div></div>
      <span class="n">${name}</span><span class="h">0</span><span class="sub">0 hits · best —</span><span class="clock">0:45</span><span class="ltag">LEADING</span></div>`;
    card.innerHTML = `<div class="lbl">1v1 <span class="beta">BETA</span></div>
      <div class="arena"><div class="embers">${emb}</div><span class="live">● LIVE</span>${pl('me', YOU, C1, 'ga')}<span class="vs">VS</span>${pl('op', THEM, C2, 'gb')}</div>
      <p class="rules">${PPS} points for every second of every hit · most points wins</p>
      <div class="btns"><div class="btn">Minimize</div><div class="btn">Give up</div></div>`;
  }
  function plus(side, n){ const a = $('.arena'); if (!a) return; const e = document.createElement('span'); e.className = 'plus'; e.textContent = '+' + n; e.style.setProperty('--pc', side === 'me' ? C1 : C2); e.style[side === 'me' ? 'left' : 'right'] = '16%'; a.appendChild(e); setTimeout(() => e.remove(), 950); }
  function blaze(side){ const p = $('#p-' + side); if (!p) return; p.classList.remove('blaze'); void p.offsetWidth; p.classList.add('blaze'); setTimeout(() => p.classList.remove('blaze'), 4200); buzz([30, 30, 30, 30, 80]); }
  function arenaPaint(el){
    const left = CAP - el, f = Math.max(0, left / CAP);
    for (const side of ['me', 'op']){
      const o = st[side], p = $('#p-' + side); if (!p) continue;
      const hEl = p.querySelector('.h'); if (hEl.textContent !== String(o.pts)){ hEl.classList.remove('pop'); void hEl.offsetWidth; hEl.classList.add('pop'); hEl.textContent = o.pts; }
      p.querySelector('.sub').textContent = `${o.hits} ${o.hits === 1 ? 'hit' : 'hits'} · best ${o.best ? o.best + 's' : '—'}`;
      p.querySelector('.fg').setAttribute('stroke-dashoffset', (C * (1 - f)).toFixed(1));
      p.querySelector('.clock').textContent = side === 'me' && o.on ? ((performance.now() - o.start) / 1000).toFixed(1) + 's' : mmss(left);
      p.classList.toggle('hitting', side === 'me' && o.on); p.classList.toggle('low', left < 15);
      p.classList.toggle('lead', side === 'me' ? st.me.pts > st.op.pts : st.op.pts > st.me.pts);
    }
    $('#frame').classList.toggle('low', left < 15);
  }
  function result(){
    document.body.classList.add('win'); $('#frame').classList.remove('on', 'low');
    const a = st.me, b = st.op, r = (k, x, y, w) => `<tr><th>${k}</th><td class="${w > 0 ? 'up' : ''}">${x}</td><td class="${w < 0 ? 'up' : ''}">${y}</td></tr>`, c = (x, y) => x === y ? 0 : x > y ? 1 : -1, s = v => v ? Math.round(v * 10) / 10 + 's' : '—';
    card.innerHTML = `<div class="lbl">1v1 <span class="beta">BETA</span></div><div class="res"><div class="t">You won</div><p class="muted" style="margin:0">Time’s up · ${a.pts} to ${b.pts}</p></div>
      ${BET ? `<div class="rp">+${BET} RP</div>` : ''}
      <table><thead><tr><th></th><th>${YOU}</th><th>${THEM}</th></tr></thead><tbody>
      ${r('Points', a.pts, b.pts, c(a.pts, b.pts))}${r('Counted hits', a.hits, b.hits, c(a.hits, b.hits))}${r('Longest hit', s(a.best), s(b.best), c(a.best, b.best))}
      ${r('Total hit time', s(a.tot), s(b.tot), c(a.tot, b.tot))}${r('Blinkers', a.bl, b.bl, c(a.bl, b.bl))}</tbody></table>
      <div class="btn go">Clear</div>`;
    setTimeout(() => $('#replay').classList.add('on'), 2500);
  }

  function tick(){
    const now = performance.now(), t = (now - T0) / 1000;
    if (t < 2.2){ if (phase !== 'lobby'){ phase = 'lobby'; lobby(); } return; }
    if (t < 7.7){ phase = 'heat'; heat(t - 2.2); return; }
    const el = t - 7.7;
    if (phase !== 'live' && phase !== 'done'){ phase = 'live'; arenaBuild(); $('#frame').classList.add('on'); splash('FIGHT!', 'Every second counts', C1); buzz([40, 60, 40]); }
    if (phase === 'live'){
      steps.forEach(x => {
        const o = st[x.who];
        if (!x.on && !x.done && el >= x.at){ x.on = true; if (x.who === 'me'){ o.on = true; o.start = now; buzz(15); } }
        if (x.on && el >= x.at + x.len){ x.on = false; x.done = true; if (x.who === 'me') o.on = false;
          o.hits++; o.best = Math.max(o.best, x.len); o.tot = Math.round((o.tot + x.len) * 10) / 10; o.pts = Math.round(o.tot * PPS);
          plus(x.who, Math.round(x.len * PPS)); if (x.who === 'me') buzz(15); if (x.len >= 8){ o.bl++; setTimeout(() => blaze(x.who), 60); } }
      });
      arenaPaint(el);
      if (el >= CAP + .2){ phase = 'done'; buzz([60, 40, 60, 40, 120]); splash('VICTORY', st.me.pts + ' – ' + st.op.pts, '#ffd23f'); setTimeout(confetti, 250); setTimeout(result, 700); }
    }
  }
  function play(){
    clearInterval(timer); document.body.classList.remove('win'); $('#replay').classList.remove('on'); $('#frame').classList.remove('on', 'low');
    document.querySelectorAll('.splash,.confetti').forEach(e => e.remove());
    st = { me: P(), op: P() }; steps = SCRIPT.map(x => Object.assign({}, x)); phase = ''; T0 = performance.now(); timer = setInterval(tick, 80); tick();
  }
  $('#tap').addEventListener('click', () => { $('#tap').remove(); try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch(e){} play(); });
  document.addEventListener('click', e => { if (phase === 'done' && !$('#tap')) play(); });
})();
</script></body></html>
