# Gym Pass iPhone app. The GitHub workflow (.github/workflows/gym.yml) turns this into an Xcode project with
# XcodeGen and builds an unsigned GymPass.ipa. Sideloadly signs it with your own Apple ID when you install it.
name: GymPass
options:
  bundleIdPrefix: com.gympass
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  GymPass:
    type: application
    platform: iOS
    sources:
      - path: GymPass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gympass.app
        INFOPLIST_FILE: GymPass/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: GymPass/Info.plist
      properties:
        CFBundleDisplayName: Gym Pass
        CFBundleName: GymPass
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan the barcode on your gym card.
        NSLocationWhenInUseUsageDescription: Save where your gym is so Gym Pass can show your barcode when you get there.
        NSLocationAlwaysAndWhenInUseUsageDescription: Gym Pass notifies you with your barcode when you arrive at your gym, even when the app is closed. Your location never leaves your iPhone.
        ITSAppUsesNonExemptEncryption: false
